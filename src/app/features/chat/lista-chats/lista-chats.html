<section class="chats-container">

    <div class="page-header">

        <h1>Chats</h1>

        <p>
            Conversaciones activas con donadores y beneficiarios.
        </p>

    </div>

    <input
        class="busqueda"
        type="text"
        placeholder="Buscar conversación..."
    >

    <div class="chat-card" 
    *ngFor="let chat of chats">

        <div class="avatar">
            {{ chat.usuario.charAt(0) }}
        </div>

        <div class="chat-info">

            <h3>
            {{ chat.usuario }}
        </h3>

            <p>
            {{ chat.ultimoMensaje }}
            </p>

            <small>
            {{ chat.fecha }}
            </small>

        </div>

    </div>

</section>
