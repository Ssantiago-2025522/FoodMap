<section class="historial-container">

    <div class="page-header">
        <h1>Historial de Solicitudes y Entregas</h1>

        <p>
            Consulta el registro de todas las solicitudes finalizadas.
        </p>
    </div>

    <div class="historial-card" 
    
    *ngFor="let item of historial">

        <h3>
            {{ item.donacion }}
        </h3>

        <p>
            Fecha:
            {{ item.fecha }}
        </p>

        <p>
            Estado:
            {{ item.estado }}
        </p>

        <p>
            {{ item.observacion }}
        </p>

    </div>


</section>
