<section class="notificaciones-container">

    <div class="page-header">
        <h1>Notificaciones</h1>
        <p>Mantente informado sobre la actividad de tus solicitudes y donaciones.</p>
    </div>

    <div class="notificacion-card"
    
        *ngFor="let notificacion of notificaciones">

        <h3>
            {{ notificacion.titulo }}
        </h3>

        <p>
            {{ notificacion.mensaje }}
        </p>

        <small>
            {{ notificacion.fecha }}
        </small>

    </div>

</section>
