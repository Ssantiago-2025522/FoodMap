<section class="crear-solicitud-container">

    <div class="page-header">
        <h1>Solicitar Donación</h1>
        <p>Completa la información para enviar tu solicitud.</p>
    </div>

    <form class="solicitud-form">

        <div class="form-group">
            <div class="donacion-info">
                <label>ID de la Donación</label>
                <input type="number"
                    placeholder="Ingrese el ID de la donación"
                    [(ngModel)]="idDonacion"
                    name="idDonacion"
                    [disabled]="idDonacionBloqueado">
            </div>
        </div>

        <div class="form-group">
            <label>Cantidad solicitada</label>
            <input type="number"
                placeholder="Ingrese la cantidad"
                [(ngModel)]="cantidadSolicitada"
                name="cantidadSolicitada">
        </div>

        <div class="form-group">
            <label>Comentario</label>
            <textarea rows="4"
                placeholder="Describe por qué necesitas esta donación"
                [(ngModel)]="comentario"
                name="comentario">
            </textarea>
        </div>

        <div class="form-group">
            <label>Ubicación de entrega</label>
            <input type="text"
                placeholder="Ej. Zona 7, Guatemala"
                [(ngModel)]="ubicacionEntrega"
                name="ubicacionEntrega">
        </div>

        <p *ngIf="error" style="color: red;">{{ error }}</p>

        <div class="acciones">
            <button type="button" (click)="confirmarSolicitud()" [disabled]="enviando">
                {{ enviando ? 'Enviando...' : 'Enviar Solicitud' }}
            </button>
        </div>

    </form>

    <div>
        <button routerLink="/solicitudes">Regresar</button>
    </div>

</section>
