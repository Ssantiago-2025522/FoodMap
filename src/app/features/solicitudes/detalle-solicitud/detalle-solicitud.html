<section class="detalle-container">

    <div class="page-header">

        <h1>Detalle de Solicitud</h1>

        <p>
            Revisa la información antes de aceptar o rechazar.
        </p>

        <button class="btn-regresar" routerLink="/solicitudes">
            Regresar
        </button>

    </div>

    <div class="detalle-info">

        <div class="detalle-card">

            <h2>Frutas y Verduras</h2>

            <div class="info-item">
                <strong>Solicitante:</strong>
                María López
            </div>

            <div class="info-item">
                <strong>Correo:</strong>
                maria@email.com
            </div>

            <div class="info-item">
                <strong>Teléfono:</strong>  
                12345678
            </div>

            <div class="info-item">
                <strong>Cantidad:</strong>
                5
            </div>

            <div class="info-item">
                <strong>Ubicación:</strong>
                Zona 7, Guatemala
            </div>

            <div class="info-item">
                <strong>Fecha:</strong>
                08/09/2026
            </div>

            <div class="info-item">
                <strong>Estado:</strong>

                <span class="estado-pendiente">
                    Pendiente
                </span>
            </div>

            <div class="comentario">

                <h3>Comentario</h3>

                <p>
                    Necesito esta donación para apoyar a mi familia.
                </p>

            </div>

            <div class="acciones">

                <button class="btn-aceptar" (click)="aceptarSolicitud()">
                    Aceptar
                </button>

                <button class="btn-rechazar" (click)="rechazarSolicitud()">
                    Rechazar
                </button>

            </div>

        </div>

    </div>

</section>
