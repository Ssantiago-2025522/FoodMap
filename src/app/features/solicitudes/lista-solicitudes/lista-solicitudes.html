<section class="solicitudes-container">

    <h1>{{ titulo_solicitud }}</h1>

    <div>
        <button class="btn-crear" routerLink="/crear-solicitud">
            Crear Solicitud
        </button>
    </div>

    <div class="solicitud-grid">

        <div class="solicitud-card"
            *ngFor="let solicitud of solicitudes">

            <h3>{{ solicitud.titulo }}</h3>

            <p>
                Descripcion:
                {{solicitud.descripcion }}
            </p>

            <p>
                Cantidad:
                {{ solicitud.cantidad }}
            </p>

            <p>
                Beneficiario:
                {{ solicitud.beneficiario }}
            </p>

            <p>
                Ubicación:
                {{ solicitud.ubicacion }}
            </p>

            <p>
                Fecha:
                {{ solicitud.fecha }}
            </p>

            <p>
                Estado:
                {{ solicitud.estado }}
            </p>

            <button class="btn-detalle" routerLink="/detalle-solicitud">
                Ver Detalle Solicitud
            </button>

        </div>

    </div>

</section>
