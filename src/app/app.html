<main class="contenedor-principal">
  <header class="encabezado-app">
    <h1>FoodMap - Módulo de Donaciones</h1>
    <button class="btn-nueva-donacion" (click)="abrirFormularioCrear()">
      + Nueva Donación
    </button>
  </header>

  @if (mostrarFormulario) {
    <section class="seccion-formulario">
      <app-donacion-formulario
        [donacionEditar]="donacionSeleccionada"
        (cancelado)="cerrarFormulario()"
        (guardado)="cerrarFormulario()"
      ></app-donacion-formulario>
    </section>
  }

  <section class="seccion-modulo">
    <app-donacion-filtros></app-donacion-filtros>
    <app-donacion-lista (editarDonacion)="abrirFormularioEditar($event)"></app-donacion-lista>
  </section>
  <section class="seccion-modulo">
  <app-donacion-filtros></app-donacion-filtros>
  <app-donacion-mapa></app-donacion-mapa>
  <app-donacion-lista (editarDonacion)="abrirFormularioEditar($event)"></app-donacion-lista>
</section>
</main>
