<div class="contenedor-generar-qr">
  <h2>Generar código QR de entrega</h2>

  <div class="campo">
    <label for="idEntrega">ID de la entrega</label>
    <input
      type="text"
      id="idEntrega"
      name="idEntrega"
      [(ngModel)]="idEntrega"
    />
  </div>

  <div class="acciones">
    <button type="button" (click)="generarQr()">Generar QR</button>
    <button type="button" (click)="limpiar()">Limpiar</button>
  </div>

  <p class="mensaje-error" *ngIf="mensajeError">{{ mensajeError }}</p>

  <div class="detalle-qr" *ngIf="entregaConQr">
    <h3>QR generado</h3>
    <p><strong>ID:</strong> {{ entregaConQr.id }}</p>
    <p><strong>Donador:</strong> {{ entregaConQr.donadorId }}</p>
    <p><strong>Beneficiario:</strong> {{ entregaConQr.beneficiarioId }}</p>
    <p><strong>Descripción:</strong> {{ entregaConQr.descripcion }}</p>
    <p><strong>Estado:</strong> {{ entregaConQr.estado }}</p>
    <p><strong>Código QR:</strong> {{ entregaConQr.codigoQr }}</p>

    <div class="imagen-qr" *ngIf="imagenQr">
      <img [src]="imagenQr" alt="Código QR de la entrega" />
    </div>
  </div>
</div>
