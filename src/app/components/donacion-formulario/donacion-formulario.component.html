<div class="contenedor-formulario">
  <h2>{{ modoEdicion ? 'Editar Donación' : 'Crear Nueva Donación' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="campo">
      <label for="titulo">Título *</label>
      <input id="titulo" type="text" formControlName="titulo" placeholder="Ej. Manzanas frescas" />
    </div>

    <div class="campo">
      <label for="descripcion">Descripción *</label>
      <textarea id="descripcion" formControlName="descripcion" rows="3" placeholder="Detalles de los alimentos..."></textarea>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="categoria">Categoría *</label>
        <select id="categoria" formControlName="categoria">
          @for (cat of categorias; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      <div class="campo">
        <label for="cantidad">Cantidad *</label>
        <input id="cantidad" type="number" formControlName="cantidad" min="1" />
      </div>
    </div>

    <div class="campo">
      <label for="ubicacion">Ubicación / Dirección Exacta *</label>
      <input 
        id="ubicacion" 
        type="text" 
        formControlName="ubicacion" 
        placeholder="Ej. Av. Reforma 10-00, Zona 10, Ciudad de Guatemala" 
      />
      @if (form.get('ubicacion')?.touched && form.get('ubicacion')?.invalid) {
        <span class="error">La ubicación es requerida.</span>
      }
    </div>

    <div class="fila">
      <div class="campo">
        <label for="fechaExpiracion">Fecha de Expiración *</label>
        <input id="fechaExpiracion" type="date" formControlName="fechaExpiracion" />
      </div>

      @if (modoEdicion) {
        <div class="campo">
          <label for="estado">Estado</label>
          <select id="estado" formControlName="estado">
            @for (est of estados; track est) {
              <option [value]="est">{{ est }}</option>
            }
          </select>
        </div>
      }
    </div>

    <div class="acciones-form">
      <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="cargandoUbicacion">
        {{ cargandoUbicacion ? 'Ubicando en mapa...' : (modoEdicion ? 'Actualizar' : 'Guardar Donación') }}
      </button>
    </div>
  </form>
</div>
