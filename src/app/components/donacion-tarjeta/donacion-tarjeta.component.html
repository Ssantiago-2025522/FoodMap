<div class="tarjeta-donacion">
  <div class="encabezado">
    <h3>{{ donacion.titulo }}</h3>
    <span class="badge" [ngClass]="obtenerClaseEstado(donacion.estado)">
      {{ donacion.estado }}
    </span>
  </div>

  <p class="descripcion">{{ donacion.descripcion }}</p>

  <div class="detalles">
    <p><strong>Categoría:</strong> {{ donacion.categoria }}</p>
    <p><strong>Cantidad:</strong> {{ donacion.cantidad }}</p>
    <p><strong>Ubicación:</strong> {{ donacion.ubicacion }}</p>
    <p><strong>Vence:</strong> {{ donacion.fechaExpiracion | date:'dd/MM/yyyy' }}</p>
  </div>

  <div class="acciones">
    <div class="selector-estado">
      <label>Estado:</label>
      <select [value]="donacion.estado" (change)="onCambiarEstado($event)">
        @for (est of estadosDisponibles; track est) {
          <option [value]="est">{{ est }}</option>
        }
      </select>
    </div>

    <div class="botones">
      <button class="btn-editar" (click)="editar.emit(donacion)">Editar</button>
      <button class="btn-eliminar" (click)="eliminar.emit(donacion.id)">Eliminar</button>
    </div>
  </div>
</div>
