<div class="contenedor-promedio-calificaciones">
  <h2>Calcular promedio de calificaciones</h2>

  <div class="campo">
    <label for="calificadoId">ID del usuario calificado</label>
    <input
      type="text"
      id="calificadoId"
      name="calificadoId"
      [(ngModel)]="calificadoId"
    />
  </div>

  <div class="acciones">
    <button type="button" (click)="calcularPromedio()">Calcular promedio</button>
    <button type="button" (click)="limpiar()">Limpiar</button>
  </div>

  <p class="mensaje-error" *ngIf="mensajeError">{{ mensajeError }}</p>

  <div class="resultado-promedio" *ngIf="calculoRealizado">
    <h3>Resultado</h3>
    <p><strong>Usuario:</strong> {{ calificadoId }}</p>
    <p><strong>Cantidad de calificaciones:</strong> {{ cantidadCalificaciones }}</p>
    <p><strong>Promedio:</strong> {{ promedio }}</p>
  </div>
</div>
